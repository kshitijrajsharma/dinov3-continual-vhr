name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint and type check
        run: just lint

      - name: Run tests
        run: just test
